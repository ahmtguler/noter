name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, test, build
    # macos-26's default Xcode (26.4.1) matches local dev. No explicit
    # xcode-select: pinning an exact /Applications path breaks whenever the
    # image rotates versions — that's how the old macos-14 + Xcode 15.4 pin
    # rotted (xcodegen emits project format 77, which needs Xcode 16+, and
    # the Swift Testing suites need Xcode 16+ anyway).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # swiftlint / swiftformat / xcbeautify ship preinstalled on the image;
      # only xcodegen is missing.
      - name: Install tools
        run: brew install xcodegen

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('project.yml', '**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Generate Xcode project
        run: xcodegen generate

      - name: SwiftFormat (lint mode)
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint --strict --reporter github-actions-logging

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Noter.xcodeproj \
            -scheme Noter \
            -destination 'platform=macOS' \
            | xcbeautify

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Noter.xcodeproj \
            -scheme Noter \
            -configuration Release \
            -destination 'platform=macOS' \
            | xcbeautify
