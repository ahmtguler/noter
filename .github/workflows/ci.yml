name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes older runs pointless. Cancelling them
# matters here: macOS runners bill at 10x on private repos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap Linux job. Gates the expensive macOS job below so a stale bundle or a
  # type error fails in ~30s instead of burning macOS minutes.
  js:
    name: JS typecheck and bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Packages/MarkdownEditor/JS
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Pinned to an LTS major. The bundle-drift check below is what
          # actually proves this agrees with local dev: esbuild ships a native
          # binary, so output depends on its version rather than Node's, and a
          # mismatch would surface as drift rather than silently.
          node-version: 24
          cache: npm
          cache-dependency-path: Packages/MarkdownEditor/JS/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # editor.bundle.js is committed so `swift build` works without Node. That
      # trade-off is only safe if something proves the blob still matches its
      # sources — esbuild is deterministic and npm ci pins the version, so a
      # rebuild must produce a byte-identical file.
      - name: Rebuild bundle and check for drift
        run: |
          npm run build
          cd "$GITHUB_WORKSPACE"
          BUNDLE=Packages/MarkdownEditor/Sources/MarkdownEditor/Resources/editor.bundle.js
          if ! git diff --quiet -- "$BUNDLE"; then
            echo "::error file=$BUNDLE::editor.bundle.js is stale. Run 'npm run build' in Packages/MarkdownEditor/JS and commit the result."
            git diff --stat -- "$BUNDLE"
            exit 1
          fi
          echo "Bundle is in sync with JS/src."

  swift:
    name: Lint, test, build
    needs: js
    # macos-26's default Xcode (26.4.1) matches local dev. No explicit
    # xcode-select: pinning an exact /Applications path breaks whenever the
    # image rotates versions — that's how the old macos-14 + Xcode 15.4 pin
    # rotted (xcodegen emits project format 77, which needs Xcode 16+, and
    # the Swift Testing suites need Xcode 16+ anyway).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # xcbeautify and xcodegen are version-tolerant here — they format output
      # and generate the project, neither of which gates the build on their
      # exact release. brew no-ops in seconds when a formula is present.
      - name: Install tools
        run: brew install xcbeautify xcodegen

      # Both linters gate the build, and both change their default rules
      # between releases — SwiftFormat 0.62 added wrapIfStatementBodies, which
      # failed CI on code that formatted clean under the 0.61 everyone had
      # locally. `brew install swiftlint` was the same trap one step removed:
      # it always fetched the newest release, so CI silently ran a different
      # linter than local dev. Pin both to the versions recorded in the repo and
      # install them ahead of $PATH, since the image's copies live in the
      # Homebrew prefix and would otherwise win.
      - name: Install pinned linters
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          FORMAT_VERSION="$(tr -d '[:space:]' < .swiftformat-version)"
          curl -fsSL -o /tmp/swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${FORMAT_VERSION}/swiftformat.zip"
          unzip -q -o /tmp/swiftformat.zip -d /tmp/swiftformat
          install -m 0755 /tmp/swiftformat/swiftformat "$HOME/.local/bin/swiftformat"

          LINT_VERSION="$(tr -d '[:space:]' < .swiftlint-version)"
          curl -fsSL -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${LINT_VERSION}/portable_swiftlint.zip"
          unzip -q -o /tmp/swiftlint.zip -d /tmp/swiftlint
          install -m 0755 /tmp/swiftlint/swiftlint "$HOME/.local/bin/swiftlint"

          INSTALLED_FORMAT="$("$HOME/.local/bin/swiftformat" --version)"
          INSTALLED_LINT="$("$HOME/.local/bin/swiftlint" version)"
          if [ "$INSTALLED_FORMAT" != "$FORMAT_VERSION" ]; then
            echo "::error::expected SwiftFormat $FORMAT_VERSION, got $INSTALLED_FORMAT"
            exit 1
          fi
          if [ "$INSTALLED_LINT" != "$LINT_VERSION" ]; then
            echo "::error::expected SwiftLint $LINT_VERSION, got $INSTALLED_LINT"
            exit 1
          fi
          echo "SwiftFormat $INSTALLED_FORMAT and SwiftLint $INSTALLED_LINT pinned."

      - name: Cache DerivedData
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('project.yml', '**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Generate Xcode project
        run: xcodegen generate

      - name: SwiftFormat (lint mode)
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint --strict --reporter github-actions-logging

      # The package has its own test target that the Noter scheme does not
      # include, so it only runs via swift test.
      - name: Test MarkdownEditor package
        run: swift test --package-path Packages/MarkdownEditor

      - name: Test app
        run: |
          set -o pipefail
          xcodebuild test \
            -project Noter.xcodeproj \
            -scheme Noter \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            | xcbeautify

      - name: Coverage summary
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            {
              echo "### Code coverage"
              echo '```'
              xcrun xccov view --report --only-targets TestResults.xcresult 2>/dev/null \
                || echo "(no coverage data produced)"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build (Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Noter.xcodeproj \
            -scheme Noter \
            -configuration Release \
            -destination 'platform=macOS' \
            | xcbeautify
