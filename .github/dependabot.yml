version: 2

# Note: the KeyboardShortcuts SwiftPM dependency is declared in project.yml,
# which Dependabot cannot parse (it reads Package.swift). Bump that one by hand.
updates:
  - package-ecosystem: npm
    directory: /Packages/MarkdownEditor/JS
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: scope
    groups:
      codemirror:
        patterns:
          - "@codemirror/*"
          - "@lezer/*"
          - codemirror

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
