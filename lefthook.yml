pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.swift"
      run: swiftformat {staged_files}
      stage_fixed: true
    lint:
      glob: "*.swift"
      run: |
        if [ "$(xcode-select -p)" = "/Library/Developer/CommandLineTools" ]; then
          echo "⚠️  Full Xcode not configured (xcode-select points to Command Line Tools)."
          echo "    Skipping SwiftLint locally — CI will still enforce it on push."
          exit 0
        fi
        swiftlint lint --strict --quiet {staged_files}
    # Swift only ships editor.bundle.js, never the TypeScript sources, so a .ts
    # edit that isn't re-bundled ships nothing. Rebuild and re-stage the blob so
    # the two can't drift apart in a commit.
    js-bundle:
      glob: "Packages/MarkdownEditor/JS/src/*.ts"
      root: "Packages/MarkdownEditor/JS/"
      run: |
        if [ ! -d node_modules ]; then
          echo "⚠️  node_modules missing in Packages/MarkdownEditor/JS."
          echo "    Run 'npm install' there — CI will enforce the bundle is current."
          exit 0
        fi
        npm run typecheck
        npm run build
      stage_fixed: true

commit-msg:
  commands:
    conventional:
      run: npx --yes --package=@commitlint/cli --package=@commitlint/config-conventional -- commitlint --edit {1}

pre-push:
  # piped: stop at the first failing job. Without it a rejected branch name
  # still pays for a full build and test run before reporting the failure.
  piped: true
  # v2 `jobs` (an ordered list), not `commands`. The guards below must run on
  # every push, including one that changes no files — lefthook filters
  # `commands` against {push_files} and silently skips them when that set is
  # empty, which let an amend-and-force-push to main slip straight past the
  # guard. `commands` also silently drops unknown keys, so `priority` and
  # `skip_empty` looked applied while doing nothing; jobs run in list order.
  jobs:
    # Trunk-based development: main only moves through reviewed PRs.
    - name: no-direct-push-to-main
      run: |
        branch="$(git rev-parse --abbrev-ref HEAD)"
        if [ "$branch" = "main" ]; then
          echo "❌ Direct pushes to main are not allowed."
          echo ""
          echo "   Branch off and open a PR instead:"
          echo "     git checkout -b feat/my-change"
          echo "     git push -u origin feat/my-change"
          echo "     gh pr create"
          exit 1
        fi

    - name: branch-name
      run: |
        branch="$(git rev-parse --abbrev-ref HEAD)"
        pattern='^(feat|fix|chore|docs|refactor|test|style|perf|ci|build|revert)/[a-z0-9][a-z0-9._-]*$'
        if ! echo "$branch" | grep -qE "$pattern"; then
          echo "❌ Branch name '$branch' does not match <type>/<kebab-case-description>."
          echo ""
          echo "   Allowed types: feat fix chore docs refactor test style perf ci build revert"
          echo "   Example:       feat/link-popover-keyboard-nav"
          echo ""
          echo "   Rename with:   git branch -m <new-name>"
          exit 1
        fi

    - name: build
      run: |
        if [ ! -d Noter.xcodeproj ]; then
          echo "ℹ️  Noter.xcodeproj not generated yet (run 'make generate'). Skipping build."
          exit 0
        fi
        if [ "$(xcode-select -p)" = "/Library/Developer/CommandLineTools" ]; then
          echo "⚠️  Full Xcode not configured. Skipping build — CI will enforce."
          exit 0
        fi
        set -o pipefail
        xcodebuild -project Noter.xcodeproj -scheme Noter -configuration Debug -destination 'platform=macOS' build | xcbeautify

    - name: test
      run: |
        if [ ! -d Noter.xcodeproj ]; then
          echo "ℹ️  Noter.xcodeproj not generated yet. Skipping tests."
          exit 0
        fi
        if [ "$(xcode-select -p)" = "/Library/Developer/CommandLineTools" ]; then
          echo "⚠️  Full Xcode not configured. Skipping tests — CI will enforce."
          exit 0
        fi
        set -o pipefail
        swift test --package-path Packages/MarkdownEditor
        xcodebuild test -project Noter.xcodeproj -scheme Noter -destination 'platform=macOS' | xcbeautify
